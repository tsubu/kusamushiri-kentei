<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>草むしり検定実技</title>
  <!-- 読み込み元を自サイト・three.js（unpkg）・Google Fonts に限定する。
       下の importmap を書き換えたら script-src の sha256 も計算し直すこと -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://unpkg.com 'sha256-BuRfDHNNiZBKrujtbSvm91+xDusD4qhV/Jq6qsAu4ig='; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      },
      "integrity": {
        "https://unpkg.com/three@0.160.0/build/three.module.js": "sha384-61S/Nu32S3E5+n+KpCOTb2eRYps6fVKm+9Gz1QBvSePFthb46f063Aa/qe/lykFZ",
        "https://unpkg.com/three@0.160.0/examples/jsm/utils/BufferGeometryUtils.js": "sha384-jHGXS4+FuVOBnZkNme2ury3Ccg5DWDLYK22xX/WGdZCZsjRM4J+3n6Qc4CXx1Hjf"
      }
    }
  </script>
</head>
<body>
  <div id="ui" class="ui">
    <div id="start-screen" class="panel start-screen">
      <div class="title-logo">
        <svg class="title-chara" viewBox="0 0 120 110" aria-hidden="true">
          <g fill="#fff" stroke="#5b4636" stroke-width="3.2" stroke-linejoin="round">
            <ellipse cx="30" cy="24" rx="11" ry="13" transform="rotate(-24 30 24)"/>
            <ellipse cx="90" cy="24" rx="11" ry="13" transform="rotate(24 90 24)"/>
            <ellipse cx="60" cy="62" rx="46" ry="40"/>
          </g>
          <ellipse cx="30" cy="25" rx="5" ry="6.5" fill="#ffd3dc" transform="rotate(-24 30 25)"/>
          <ellipse cx="90" cy="25" rx="5" ry="6.5" fill="#ffd3dc" transform="rotate(24 90 25)"/>
          <ellipse cx="44" cy="58" rx="4" ry="5" fill="#3a2a22"/>
          <ellipse cx="76" cy="58" rx="4" ry="5" fill="#3a2a22"/>
          <ellipse cx="33" cy="70" rx="7.5" ry="4.5" fill="#ffb3c1"/>
          <ellipse cx="87" cy="70" rx="7.5" ry="4.5" fill="#ffb3c1"/>
          <path d="M55 68 Q60 74 65 68" fill="none" stroke="#3a2a22" stroke-width="2.6" stroke-linecap="round"/>
          <path d="M104 92 q4 -14 -2 -24 M104 92 q8 -10 12 -12 M104 92 q-6 -8 -12 -9" fill="none" stroke="#6fbf5a" stroke-width="3.4" stroke-linecap="round"/>
        </svg>
        <h1 class="title" aria-label="草むしり検定実技">
          <span class="title-main"><span>草</span><span>む</span><span>し</span><span>り</span><span>検</span><span>定</span></span>
          <span class="title-badge">実技</span>
        </h1>
      </div>
      <p class="lead">くさを むしりながら もりのみちを すすもう！</p>
      <p class="controls">
        移動：← → または A / D　/　ジャンプ：Space / ↑ / W<br>
        スマホ：左右タップで移動、画面上部タップでジャンプ
      </p>
      <button id="start-btn" class="btn btn-soft">検定開始</button>
      <p class="title-hint">しばらく待つと デモプレイが はじまるよ</p>
    </div>

    <div id="demo-banner" class="demo-banner hidden">
      <span class="demo-label">デモプレイ</span>
      <span class="demo-hint">クリック または キーで タイトルへ</span>
    </div>

    <!-- 画面のあちこちに置く表示（位置は style.css の .hud-* で指定） -->
    <div id="hud" class="hud hidden">
      <div class="hud-item hud-rank">段位 <span id="rank">検定落ち</span></div>
      <div class="hud-item hud-time">タイム <span id="time">0:00</span></div>
      <div class="hud-item hud-grass"><small>草</small><span id="grass-score">0</span></div>
      <div class="hud-item hud-speed"><span id="speed">0</span><small>km/h</small></div>
      <div class="hud-item hud-distance">距離 <span id="score">0</span> m</div>
    </div>

    <button id="pause-btn" type="button" class="pause-btn ui-btn hidden" aria-label="一時停止">Ⅱ</button>

    <div id="pause-screen" class="panel pause-screen hidden">
      <h2>ひとやすみ中</h2>
      <p class="pause-hint">Esc キーでも つづきから再開できます</p>
      <div class="pause-actions">
        <button id="resume-btn" type="button" class="btn btn-soft">つづける</button>
        <button id="retry-btn" type="button" class="btn btn-soft btn-sub">さいしょから</button>
        <button id="to-title-btn" type="button" class="btn btn-soft btn-sub">タイトルへ</button>
      </div>
    </div>

    <div id="countdown" class="countdown hidden">
      <span id="countdown-num" class="countdown-num">3</span>
      <span id="countdown-sub" class="countdown-sub"></span>
    </div>

    <div id="rankup" class="rankup hidden">
      <span id="rankup-text"></span>
    </div>

    <div id="jump-gauge" class="jump-gauge">
      <div class="jump-main">
        <span class="gauge-label">ジャンプ</span>
        <div class="jump-charges">
          <span class="jump-dot" id="jump-dot-0"></span>
          <span class="jump-dot" id="jump-dot-1"></span>
          <span class="jump-dot" id="jump-dot-2"></span>
        </div>
        <div class="jump-bar-wrap">
          <div class="jump-bar" id="jump-bar"></div>
        </div>
      </div>
      <div class="lives-box">
        <span class="gauge-label">いのち</span>
        <span id="lives" class="lives">♥♥</span>
      </div>
    </div>

    <!-- ランキングの画面キャプチャを大きく見る（クリックで閉じる） -->
    <div id="shot-viewer" class="shot-viewer hidden" role="dialog" aria-label="画面キャプチャ">
      <img id="shot-viewer-img" alt="">
    </div>

    <div id="gameover-screen" class="panel gameover-screen hidden">
      <h2>検定終了</h2>
      <p class="rank-result">検定結果：<span id="final-rank">検定落ち</span></p>
      <p class="final-stats">草むしりスコア <b><span id="final-grass">0</span></b>　走行距離 <b><span id="final-score">0</span> m</b></p>

      <figure class="result-shot">
        <img id="result-shot" alt="ゲームオーバー時の画面">
        <div class="shot-actions">
          <button id="shot-copy" type="button" class="shot-btn">画像をコピー</button>
          <a id="shot-download" class="shot-btn" download="kusamushiri.jpg">画像を保存</a>
        </div>
        <figcaption id="shot-msg" class="shot-msg"></figcaption>
      </figure>

      <form id="name-entry" class="name-entry" autocomplete="off">
        <label id="name-label" for="name-input">なまえを入れて この画面と一緒に ランキングに登録しよう</label>
        <div class="name-row">
          <input id="name-input" type="text" maxlength="10" placeholder="なまえ（10文字まで）" required>
          <button id="name-submit" type="submit" class="btn btn-soft btn-small">登録</button>
        </div>
      </form>
      <p id="entry-msg" class="entry-msg"></p>

      <div class="ranking-box">
        <h3 id="ranking-title">ランキング</h3>
        <ol id="ranking-list" class="ranking-list"></ol>
      </div>

      <div class="go-actions">
        <button id="share-x" type="button" class="btn btn-x">𝕏 にポスト</button>
        <button id="restart-btn" type="button" class="btn btn-soft">再挑戦</button>
      </div>
    </div>
  </div>

  <script type="module" src="game.js"></script>
</body>
</html>
